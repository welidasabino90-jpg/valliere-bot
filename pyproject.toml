[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "valliere-bot"
version = "0.1.0"
description = "Núcleo oficial do simulador social persistente VALLIÈRE."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "discord.py>=2.6,<3",
  "python-dotenv>=1.0,<2",
  "supabase>=2.18,<3",
]

[project.scripts]
valliere = "valliere.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

